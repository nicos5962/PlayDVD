# PlayDVD: the audio of a DVD title (dvd:// url, see Importer.pm), extracted with
# Bin/DVD-Transcode (ffmpeg). The script plays a title from its start: it takes no
# seek offset, so the rules do not advertise one.
#
# $CLIENTID$ is the player id, $FILE$ the disc image, folder or VOB file.

# Output formats from least to most favorite: flac is preferred over pcm.
proxy dvd mp3,pcm,wav,flc

dvd pcm * *
    # F:{PATH=%f}R:{PATH=%F}
    [DVD-Transcode] -m $CLIENTID$ -f s24le $FILE$

dvd flc * *
    # F:{PATH=%f}R:{PATH=%F}
    [DVD-Transcode] -m $CLIENTID$ -f flac $FILE$

dvd mp3 * *
    # F:{PATH=%f}R:{PATH=%F}
    [DVD-Transcode] -m $CLIENTID$ -f mp3 $FILE$

dvd wav * *
    # F:{PATH=%f}R:{PATH=%F}
    [DVD-Transcode] -m $CLIENTID$ -f wav $FILE$

proxy iso mp3,pcm,wav,flc

iso pcm * *
    # F:{PATH=%f}R:{PATH=%F}
    [DVD-Transcode] -m $CLIENTID$ -f s24le $FILE$

iso flc * *
    # F:{PATH=%f}R:{PATH=%F}
    [DVD-Transcode] -m $CLIENTID$ -f flac $FILE$

iso mp3 * *
    # F:{PATH=%f}R:{PATH=%F}
    [DVD-Transcode] -m $CLIENTID$ -f mp3 $FILE$

iso wav * *
    # F:{PATH=%f}R:{PATH=%F}
    [DVD-Transcode] -m $CLIENTID$ -f wav $FILE$
